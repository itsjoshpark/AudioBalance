# Description:
# Builds, signs, and uploads a new version to App Store Connect, sets its
# "What's New", then tags it and publishes a GitHub release with the notes.
# Triggered manually from the Actions tab.
#         1. Each user-facing change adds a Changie fragment (`changie new`)
#         2. Choose the release type (auto picks it from the fragments' kinds);
#            try a dry run first
#
# Changie batches the unreleased fragments into .changes/<version>.md, updates
# CHANGELOG.md, and stamps MARKETING_VERSION into project.xcproj. The build
# number is the commit count; it is passed to the build and never written back.
# fastlane (fastlane/Fastfile) tests, archives, exports, and uploads.
#
# After the upload the build appears in App Store Connect (and TestFlight) once
# processing finishes, with the en-US "What's New" filled in from the notes.
# Other languages' "What's New" and submitting for review are done there.
#
# Nothing outside the runner is touched until the upload step, and a dry run
# stops before it: it archives, signs, and exports the .pkg as an artifact only.
# Turning off upload-to-app-store keeps everything else (tag, release, version
# commit) but only validates the package with App Store Connect.
#
# After the upload, the version bump is committed to main first, and only that
# commit is tagged and released, so the tag's source reports the version it
# shipped as. If a run fails after the upload but before main is bumped,
# re-running reuses the same build number and App Store Connect rejects it. Land
# any commit on main (which bumps the count) and run again. If it fails after
# main is bumped, the step's error says how to finish the tag and release.
#
# 🚨 GITHUB SECRETS REQUIRED:
#         - AC_API_KEY_P8_BASE64: App Store Connect API key (.p8), base64 encoded:
#           `base64 -i AuthKey_XXXX.p8 | pbcopy`. The key needs the Admin role so
#           Xcode can use cloud-managed signing certificates.
#         - AC_API_KEY_ID / AC_API_ISSUER_ID: shown alongside the key
#
# The app record for dev.joshuapark.AudioBalance must exist in App Store Connect
# before the first upload.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: "Release type: auto (from the Changie fragments), patch, minor, major"
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry-run:
        type: boolean
        description: "Archive and export only — no upload, tag, or release (any branch)"
        required: false
        default: false
      upload-to-app-store:
        type: boolean
        description: "Upload to App Store Connect (off: validate the package only, still tag and release)"
        required: false
        default: true

# Two runs would resolve the same tag and build number, then collide at upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A shallow clone makes `git rev-list --count` return 1, which is below
          # every build number already uploaded.
          fetch-depth: 0

      # The project uses Xcode's JSON project format (project.xcproj), which
      # needs Xcode 27.2. The xcode-27 image defaults to an older Xcode 27.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      # The runner context is unavailable in job-level env, so this is set here.
      # fastlane builds into it (see BUILD_ROOT in fastlane/Fastfile).
      - name: Set the build path
        run: echo "BUILD_ROOT=$RUNNER_TEMP/build" >>"$GITHUB_ENV"

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: v1.26.0

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Everything below the build is expensive; fail here instead.
      - name: Resolve version, build number, and notes
        id: version
        run: |
          set -euo pipefail

          # The version bump is committed back to main; releasing from anywhere
          # else would strand it on a side branch. A dry run publishes nothing, so
          # it can run from any branch.
          if [[ "$GITHUB_REF_NAME" != "main" && "${{ inputs.dry-run }}" != "true" ]]; then
            echo "::error::Releases must be run from main, not $GITHUB_REF_NAME"
            exit 1
          fi

          # `changie batch patch` happily releases nothing, so check first.
          if ! compgen -G ".changes/unreleased/*.yaml" >/dev/null; then
            echo "::error::No unreleased changes. Add fragments with \`changie new\` before releasing."
            exit 1
          fi

          previous="$(changie latest)"
          changie batch "${{ inputs.release-type }}"
          changie merge
          version="$(changie latest)"
          build="$(git rev-list --count HEAD)"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          # The release body: the version file without its "## version - date"
          # heading and the blank line after it.
          notes="$RUNNER_TEMP/notes.md"
          tail -n +3 ".changes/$version.md" >"$notes"
          [[ -s "$notes" ]] || { echo "::error::.changes/$version.md has no notes"; exit 1; }

          {
            echo "version=$version"
            echo "build=$build"
            echo "notes=$notes"
          } >>"$GITHUB_OUTPUT"

          echo "Releasing $version ($build), bumped from $previous"
          cat "$notes"

      - name: Verify unit tests pass
        run: bundle exec fastlane test

      - name: Prepare App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode >"$key"
          chmod 600 "$key"
          [[ -s "$key" ]] || { echo "::error::AC_API_KEY_P8_BASE64 decoded to an empty file"; exit 1; }
          echo "AC_KEY_PATH=$key" >>"$GITHUB_ENV"

      # Cheap check, before the build.
      - name: Preflight — verify the API key
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if ! xcrun notarytool history \
            --key "$AC_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            >/dev/null 2>&1; then
            echo "::error::The App Store Connect API key was rejected. Check AC_API_KEY_P8_BASE64, AC_API_KEY_ID, and AC_API_ISSUER_ID, and that the key has not been revoked."
            exit 1
          fi
          echo "App Store Connect API key accepted"

      - name: Archive and export
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: >
          bundle exec fastlane build
          version:${{ steps.version.outputs.version }}
          build:${{ steps.version.outputs.build }}

      - name: Verify the exported package
        id: package
        run: |
          set -euo pipefail
          export_path="$BUILD_ROOT/export"
          pkg="$(find "$export_path" -maxdepth 1 -name '*.pkg' | head -1)"
          [[ -n "$pkg" ]] || { echo "::error::No .pkg in $export_path"; ls -la "$export_path"; exit 1; }

          # Captured rather than piped: `grep -q` exits on the first match, and
          # under pipefail the writer's SIGPIPE would fail the check.
          signature="$(pkgutil --check-signature "$pkg")"
          echo "$signature"
          grep -q "3rd Party Mac Developer Installer" <<<"$signature" ||
            { echo "::error::The package is not signed with a Mac Installer Distribution certificate"; exit 1; }

          expanded="$RUNNER_TEMP/expanded"
          rm -rf "$expanded"
          pkgutil --expand-full "$pkg" "$expanded"
          app="$(find "$expanded" -name 'Audio Balance.app' -type d -prune | head -1)"
          [[ -n "$app" ]] || { echo "::error::Audio Balance.app not found in the package"; exit 1; }
          agent="$app/Contents/Library/LoginItems/Audio Balance Agent.app"
          [[ -d "$agent" ]] || { echo "::error::Audio Balance Agent.app not found in Contents/Library/LoginItems"; exit 1; }

          want_version="${{ steps.version.outputs.version }}"
          want_build="${{ steps.version.outputs.build }}"
          signers=()
          for bundle in "$app" "$agent"; do
            version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$bundle/Contents/Info.plist")"
            build="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$bundle/Contents/Info.plist")"
            [[ "$version" == "$want_version" && "$build" == "$want_build" ]] ||
              { echo "::error::$(basename "$bundle") is $version ($build), expected $want_version ($want_build)"; exit 1; }

            info="$(codesign -dvvv "$bundle" 2>&1)"
            authority="$(sed -n 's/^Authority=//p' <<<"$info" | sed -n 1p)"
            case "$authority" in
              "Apple Distribution"* | "3rd Party Mac Developer Application"*) ;;
              *) echo "::error::$(basename "$bundle") signed by '$authority', expected an Apple Distribution certificate"; exit 1 ;;
            esac
            signers+=("$(basename "$bundle"): $authority")
          done

          echo "pkg=$pkg" >>"$GITHUB_OUTPUT"
          echo "Verified $want_version ($want_build)"
          printf '  %s\n' "${signers[@]}"

      - name: Upload package as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: AudioBalance_v${{ steps.version.outputs.version }}.pkg
          path: ${{ steps.package.outputs.pkg }}

      # ---- Nothing above this line changes anything outside the runner. ----

      - name: Upload to App Store Connect and set "What's New"
        if: ${{ !inputs.dry-run }}
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: >
          bundle exec fastlane release_app_store
          version:${{ steps.version.outputs.version }}
          pkg:"${{ steps.package.outputs.pkg }}"
          notes_file:"${{ steps.version.outputs.notes }}"
          verify_only:${{ !inputs.upload-to-app-store }}

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Main is bumped first, so the tag below points at a commit whose source
      # reports the released version and holds its notes. A failure here leaves
      # no tag behind, and the next run can still pick this version.
      - name: Record the version on main
        id: record
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="${{ steps.version.outputs.version }}"
          build="${{ steps.version.outputs.build }}"

          # Changie's batch and merge already ran: the fragments became
          # .changes/$version.md, CHANGELOG.md was regenerated, and project.xcproj
          # carries the new marketing version.
          git add -A .changes CHANGELOG.md AudioBalance.xcodeproj/project.xcproj
          git commit -m "chore: release $version ($build) [skip ci]"

          failed() {
            echo "::error::$1 The build is uploaded, but main still reports the previous version and nothing is tagged. On main, run \`changie batch $version && changie merge\`, commit, then tag that commit v$version and create the release from .changes/$version.md."
            exit 1
          }

          # Rebase onto whatever landed on main during the run and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            ((attempt < 3)) || break
            echo "Push rejected (attempt $attempt), rebasing onto main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              failed "Rebasing the version bump onto main conflicted."
            fi
          done

          failed "Could not push the version bump after 3 attempts."

      - name: Tag and create the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          commit="${{ steps.record.outputs.commit }}"
          notes="${{ steps.version.outputs.notes }}"

          git tag "v$version" "$commit"
          git push origin "v$version" ||
            { echo "::error::Main is bumped to $version, but pushing tag v$version failed. Tag $commit as v$version and create the release by hand."; exit 1; }

          # The releases API can answer a request made right after the tag push
          # with a 5xx. Retry, and stop once the release exists, since a failed
          # response may still have created it.
          for attempt in 1 2 3 4 5; do
            if gh release view "v$version" >/dev/null 2>&1 ||
              gh release create "v$version" \
                --verify-tag \
                --title "v$version" \
                --notes-file "$notes"; then
              exit 0
            fi
            ((attempt < 5)) || break
            echo "Creating the release failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          echo "::error::Tag v$version is pushed, but creating the GitHub release failed. Run: gh release create v$version --verify-tag --title v$version --notes-file .changes/$version.md (without its heading)"
          exit 1
