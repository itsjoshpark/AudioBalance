name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: v1.26.0

      # Every fragment must parse and have a known kind, or the release would
      # fail at its first step.
      - name: Check the Changie fragments
        run: |
          set -euo pipefail
          if compgen -G ".changes/unreleased/*.yaml" >/dev/null; then
            changie batch auto --dry-run
          else
            echo "No unreleased changes"
          fi

      # The project uses Xcode's JSON project format (project.xcproj), which
      # needs Xcode 27.2. The xcode-27 image defaults to an older Xcode 27.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # UI tests are local-only: they need a real audio output device, launchd
      # registration and accessibility access, none of which hosted runners have.
      - name: Build and unit test
        run: bundle exec fastlane test
