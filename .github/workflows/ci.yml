name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # UI tests are local-only: they need a real audio output device, launchd
      # registration and accessibility access, none of which hosted runners have.
      - name: Build and test
        run: |
          xcodebuild \
            -scheme AudioBalance \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build test -only-testing:AudioBalanceTests
