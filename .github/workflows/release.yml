# Description:
# Builds, signs, and uploads a new version to App Store Connect, then tags it and
# publishes a GitHub release with the notes. Triggered manually from the Actions tab.
#         1. Write release notes to release-notes/next.md beforehand
#         2. Choose release type (major, minor, patch); try a dry run first
#
# After the upload the build appears in App Store Connect (and TestFlight) once
# processing finishes; submitting it for review — and the App Store "What's New"
# text — is done there.
#
# The marketing version is read from project.pbxproj and bumped by the chosen
# amount; the build number is the commit count and is never read back as input.
# Both are passed to xcodebuild, then written back to project.pbxproj and
# committed to main after the release — so a local build always reports the last
# release.
#
# Nothing outside the runner is touched until the upload step, and a dry run
# stops before it: it archives, signs, and exports the .pkg as an artifact only.
#
# After the upload, the version bump is committed to main first, and only that
# commit is tagged and released, so the tag's source reports the version it
# shipped as. If a run fails after the upload but before main is bumped,
# re-running reuses the same build number and App Store Connect rejects it. Land
# any commit on main (which bumps the count) and run again. If it fails after
# main is bumped, the step's error says how to finish the tag and release.
#
# 🚨 GITHUB SECRETS REQUIRED:
#         - AC_API_KEY_P8_BASE64: App Store Connect API key (.p8), base64 encoded:
#           `base64 -i AuthKey_XXXX.p8 | pbcopy`. The key needs the Admin role so
#           Xcode can use cloud-managed signing certificates.
#         - AC_API_KEY_ID / AC_API_ISSUER_ID: shown alongside the key
#
# The app record for dev.joshuapark.AudioBalance must exist in App Store Connect
# before the first upload.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: "Choose release type: major, minor, patch"
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        type: boolean
        description: "Archive and export only — no upload, tag, or release"
        required: false
        default: false

# Two runs would resolve the same tag and build number, then collide at upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: macos-26
    permissions:
      contents: write
    env:
      TEAM_ID: TCQ6328PP6
      PBXPROJ: AudioBalance.xcodeproj/project.pbxproj

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A shallow clone makes `git rev-list --count` return 1, which is below
          # every build number already uploaded.
          fetch-depth: 0

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The runner context is unavailable in job-level env, so these are set here.
      - name: Set build paths
        run: |
          set -euo pipefail
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/build/AudioBalance.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/build/export"
            echo "DERIVED_DATA=$RUNNER_TEMP/build/DerivedData"
          } >>"$GITHUB_ENV"

      # Before anything depends on these scripts.
      - name: Verify script tests pass
        run: |
          set -euo pipefail
          for test in scripts/*.test.sh; do "$test"; done

      # Everything below the build is expensive; fail here instead.
      - name: Resolve version and build number
        id: version
        run: |
          set -euo pipefail

          # The version bump is committed back to main; releasing from anywhere
          # else would strand it on a side branch.
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Releases must be run from main, not $GITHUB_REF_NAME"
            exit 1
          fi

          # The marketing version is authoritative in the project file; the build
          # number is mechanical and never read back as input.
          current="$(./scripts/project-version.sh read-marketing "$PBXPROJ")"
          version="$(./scripts/bump-version.sh "$current" "${{ inputs.release-type }}")"
          build="$(git rev-list --count HEAD)"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          notes="release-notes/next.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing $notes. Copy release-notes/TEMPLATE.md to it and write the release notes."
            exit 1
          fi
          if cmp -s "$notes" release-notes/TEMPLATE.md; then
            echo "::error::$notes is still the unedited template. Write the release notes before releasing."
            exit 1
          fi
          if [[ -e "release-notes/$version.md" ]]; then
            echo "::error::release-notes/$version.md already exists, so the archived notes for this release would be overwritten."
            exit 1
          fi

          {
            echo "version=$version"
            echo "build=$build"
            echo "notes=$notes"
          } >>"$GITHUB_OUTPUT"

          echo "Releasing $version ($build), bumped from $current"

      # UI tests are local-only (see ci.yml).
      - name: Verify unit tests pass
        run: |
          set -euo pipefail
          xcodebuild \
            -project AudioBalance.xcodeproj \
            -scheme AudioBalance \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/build/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test -only-testing:AudioBalanceTests

      - name: Prepare App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode >"$key"
          chmod 600 "$key"
          [[ -s "$key" ]] || { echo "::error::AC_API_KEY_P8_BASE64 decoded to an empty file"; exit 1; }
          echo "AC_KEY_PATH=$key" >>"$GITHUB_ENV"

      # Cheap check, before the build.
      - name: Preflight — verify the API key
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if ! xcrun notarytool history \
            --key "$AC_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            >/dev/null 2>&1; then
            echo "::error::The App Store Connect API key was rejected. Check AC_API_KEY_P8_BASE64, AC_API_KEY_ID, and AC_API_ISSUER_ID, and that the key has not been revoked."
            exit 1
          fi
          echo "App Store Connect API key accepted"

      - name: Archive
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project AudioBalance.xcodeproj \
            -scheme AudioBalance \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AC_KEY_PATH" \
            -authenticationKeyID "$AC_API_KEY_ID" \
            -authenticationKeyIssuerID "$AC_API_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export archive
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AC_KEY_PATH" \
            -authenticationKeyID "$AC_API_KEY_ID" \
            -authenticationKeyIssuerID "$AC_API_ISSUER_ID"

      - name: Verify the exported package
        id: package
        run: |
          set -euo pipefail
          pkg="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.pkg' | head -1)"
          [[ -n "$pkg" ]] || { echo "::error::No .pkg in $EXPORT_PATH"; ls -la "$EXPORT_PATH"; exit 1; }

          # Captured rather than piped: `grep -q` exits on the first match, and
          # under pipefail the writer's SIGPIPE would fail the check.
          signature="$(pkgutil --check-signature "$pkg")"
          echo "$signature"
          grep -q "3rd Party Mac Developer Installer" <<<"$signature" ||
            { echo "::error::The package is not signed with a Mac Installer Distribution certificate"; exit 1; }

          expanded="$RUNNER_TEMP/build/expanded"
          rm -rf "$expanded"
          pkgutil --expand-full "$pkg" "$expanded"
          app="$(find "$expanded" -name 'Audio Balance.app' -type d -prune | head -1)"
          [[ -n "$app" ]] || { echo "::error::Audio Balance.app not found in the package"; exit 1; }
          agent="$app/Contents/Library/LoginItems/Audio Balance Agent.app"
          [[ -d "$agent" ]] || { echo "::error::Audio Balance Agent.app not found in Contents/Library/LoginItems"; exit 1; }

          want_version="${{ steps.version.outputs.version }}"
          want_build="${{ steps.version.outputs.build }}"
          signers=()
          for bundle in "$app" "$agent"; do
            version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$bundle/Contents/Info.plist")"
            build="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$bundle/Contents/Info.plist")"
            [[ "$version" == "$want_version" && "$build" == "$want_build" ]] ||
              { echo "::error::$(basename "$bundle") is $version ($build), expected $want_version ($want_build)"; exit 1; }

            info="$(codesign -dvvv "$bundle" 2>&1)"
            authority="$(sed -n 's/^Authority=//p' <<<"$info" | sed -n 1p)"
            case "$authority" in
              "Apple Distribution"* | "3rd Party Mac Developer Application"*) ;;
              *) echo "::error::$(basename "$bundle") signed by '$authority', expected an Apple Distribution certificate"; exit 1 ;;
            esac
            signers+=("$(basename "$bundle"): $authority")
          done

          echo "pkg=$pkg" >>"$GITHUB_OUTPUT"
          echo "Verified $want_version ($want_build)"
          printf '  %s\n' "${signers[@]}"

      - name: Upload package as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: AudioBalance_v${{ steps.version.outputs.version }}.pkg
          path: ${{ steps.package.outputs.pkg }}

      # ---- Nothing above this line changes anything outside the runner. ----

      - name: Upload to App Store Connect
        if: ${{ !inputs.dry-run }}
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions-upload.plist"
          cp .github/ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$options"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/build/upload" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AC_KEY_PATH" \
            -authenticationKeyID "$AC_API_KEY_ID" \
            -authenticationKeyIssuerID "$AC_API_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Main is bumped first, so the tag below points at a commit whose source
      # reports the released version and holds its archived notes. A failure
      # here leaves no tag behind, and the next run can still pick this version.
      - name: Record the version on main
        id: record
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="${{ steps.version.outputs.version }}"

          # Record what was just released, so local builds report the shipped
          # version and the next run has a marketing version to bump from.
          ./scripts/project-version.sh write "$PBXPROJ" \
            "$version" "${{ steps.version.outputs.build }}"

          # Archive the notes under the version they shipped as, and leave a
          # fresh template ready for the next release.
          notes="release-notes/$version.md"
          git mv "${{ steps.version.outputs.notes }}" "$notes"
          cp release-notes/TEMPLATE.md release-notes/next.md

          git add "$PBXPROJ" release-notes
          git commit -m "chore: release $version (${{ steps.version.outputs.build }}) [skip ci]"

          failed() {
            echo "::error::$1 The build is uploaded, but $PBXPROJ on main still reports the previous version and nothing is tagged. Bump main by hand (scripts/project-version.sh write $PBXPROJ $version ${{ steps.version.outputs.build }}, and archive the notes), then tag that commit v$version and create the release."
            exit 1
          }

          # Rebase onto whatever landed on main during the run and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              {
                echo "commit=$(git rev-parse HEAD)"
                echo "notes=$notes"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            ((attempt < 3)) || break
            echo "Push rejected (attempt $attempt), rebasing onto main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              failed "Rebasing the version bump onto main conflicted."
            fi
          done

          failed "Could not push the version bump after 3 attempts."

      - name: Tag and create the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          commit="${{ steps.record.outputs.commit }}"

          git tag "v$version" "$commit"
          git push origin "v$version" ||
            { echo "::error::Main is bumped to $version, but pushing tag v$version failed. Tag $commit as v$version and create the release by hand."; exit 1; }

          # The releases API can answer a request made right after the tag push
          # with a 5xx. Retry, and stop once the release exists, since a failed
          # response may still have created it.
          for attempt in 1 2 3 4 5; do
            if gh release view "v$version" >/dev/null 2>&1 ||
              gh release create "v$version" \
                --verify-tag \
                --title "v$version" \
                --notes-file "${{ steps.record.outputs.notes }}"; then
              exit 0
            fi
            ((attempt < 5)) || break
            echo "Creating the release failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          echo "::error::Tag v$version is pushed, but creating the GitHub release failed. Run: gh release create v$version --verify-tag --title v$version --notes-file ${{ steps.record.outputs.notes }}"
          exit 1
